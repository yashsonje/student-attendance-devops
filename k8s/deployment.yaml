apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance-deployment
  labels:
    app: student-attendance
spec:
  # Replica count is strictly 1 due to SQLite single-writer lock limitations
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: student-attendance-app
          image: student-attendance:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: DATABASE_PATH
              value: "/app/data/attendance.db"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: attendance-storage
              mountPath: /app/data
      volumes:
        - name: attendance-storage
          persistentVolumeClaim:
            claimName: attendance-data-pvc

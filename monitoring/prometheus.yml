global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Scrape job for the Student Attendance Flask Application
  - job_name: "student-attendance"
    metrics_path: "/metrics"
    static_configs:
      # host.docker.internal allows Prometheus container to reach host or minikube
      - targets: ["host.docker.internal:5000"]
        labels:
          environment: "local-dev"
          app: "student-attendance"
